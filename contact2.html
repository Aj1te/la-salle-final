<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
</head>
  <body>  
    <section class="contact-section py-5">
      <div class="container">
        <div class="row">
        <!-- Formulaire -->
          <div class="col-12 col-md-8">
            <div class="d-flex custom-justify-mobile">
              <h4 class="fw-bold">Formulaire de contact</h4>
            </div>
            <hr class="trait opacity-100 ms-0" id="trait-coordonnees">
            <form class="mt-5">
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <input type="text" id="nom" class="form-control bg-body-secondary" placeholder="VOTRE NOM" required>
                </div>
                <div class="col-md-6">
                  <input type="text" id="prenom" class="form-control bg-body-secondary" placeholder="VOTRE PRÉNOM" required>
                </div>
                <div class="col-md-6">
                  <input type="tel" id="telephone" class="form-control bg-body-secondary" placeholder="VOTRE TÉLÉPHONE">
                </div>
                <div class="col-md-6">
                  <input type="email" class="form-control bg-body-secondary" placeholder="VOTRE EMAIL" required>
                </div>
              </div>
              <input type="text" id="sujet" class="form-control mb-3 bg-body-secondary" placeholder="SUJET">
              <textarea id="message" class="form-control mb-3 bg-body-secondary" rows="5" placeholder="VOTRE MESSAGE" required></textarea>
              <button type="submit" class="btn btn-contact px-5 py-2 fw-bold">Envoyer</button>
            </form>
          </div>
        </div>
      </div>
    </section>
    
    <script>
              const newDiv = document.createElement("div");
              const error1 = document.createTextNode("Champ Requis");
              const error2 = document.createTextNode("Caractères non autorisés");
              let el = document.getElementById("nom").nextElementSibling;
              // currentDiv = document.getElementById("div1");
              // document.body.insertAfter(newDiv, currentDiv);

              
            const inputName = document.getElementById("nom");
            const inputPrenom = document.getElementById("prenom");

            function RegexName() {
                const inputNameValue = document.getElementById("nom").value;
                const regexName = /^[a-zA-Z\s-]+$/;
              if (regexName.test(inputNameValue)) {
                // Le nom est valide color border vert sur le input nom avec une classe css
                inputName.classList.remove("is-invalid");
                inputName.classList.add("is-valid");
              } 
              else {
                // Le nom est invalide color border rouge sur le input nom avec une classe css
                inputName.classList.remove("is-valid");
                inputName.classList.add("is-invalid");
              }
            }

            function RegexPrenom() {
                const inputPrenomValue =document.getElementById("prenom").value;
                const regexPrenom = /^[a-zA-Z\s-]+$/;
                if (regexPrenom.test(inputPrenomValue)) {
                    // Le prénom est valide color border vert sur le input prenom avec une classe css
                    inputPrenom.classList.remove("is-invalid");
                    inputPrenom.classList.add("is-valid");
                } 
                else {
                    // Le prénom est invalide color border rouge sur le input prenom avec une classe css
                    inputPrenom.classList.remove("is-valid");
                    inputPrenom.classList.add("is-invalid");
                }
            }
        
            // Ecouteur d'événement pour le champ input
            inputName.addEventListener("input", function () {
                RegexName();
            });
            inputPrenom.addEventListener("input", function () {
                RegexPrenom();
            });
            // inputName.addEventListener("change", function () {
            //     RegexName();
            // });


        </script>
